name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install shellcheck
        run: command -v shellcheck || { sudo apt-get update && sudo apt-get install -y shellcheck; }
      - name: Install lua
        run: command -v luac || command -v luac5.4 || { sudo apt-get update && sudo apt-get install -y lua5.4; }
      - name: Run checks
        run: bash scripts/ci.sh
