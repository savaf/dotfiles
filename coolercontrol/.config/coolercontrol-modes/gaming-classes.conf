# Clases de ventana (Hyprland) que activan el modo "Rendimiento" de
# CoolerControl. Una por linea, admite globs de shell ([[ $class == $pat ]]).
# '#' comenta el resto de la linea. Este fichero se relee en cada evento de
# ventana: para anadir un juego basta con editar y guardar, sin reiniciar nada.
#
# Averigua la clase real de una ventana abierta con:
#   hyprctl clients -j | jq -r '.[] | .class, .initialClass'

steam_app_*
gamescope
steam_proton

# El CLIENTE de Steam se deja fuera a proposito: suele quedarse abierto en
# segundo plano y dejaria "Rendimiento" activo todo el tiempo. Descomenta esta
# linea solo si de verdad quieres que abrir el launcher (no un juego) dispare
# el modo de alto rendimiento.
# steam

# Hueco para anadir mas lanzadores/juegos segun haga falta, por ejemplo:
# lutris
# heroic
