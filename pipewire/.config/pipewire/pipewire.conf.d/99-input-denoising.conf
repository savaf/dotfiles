# Micrófono virtual "Noise Canceling source": el micro real pasa por RNNoise
# (paquete noise-suppression-for-voice) y Discord/Brave/OBS lo eligen como entrada.
# Docs y por qué cada ajuste: docs/research/mic-noise-cancelling.md y docs/omarchy.md.
#
# - plugin por NOMBRE, no ruta absoluta: PipeWire >= 1.6.3 rechaza rutas fuera de su
#   ruta de búsqueda (/usr/lib/ladspa ya está en ella).
# - mono explícito: desde PipeWire 1.4.10 hace falta fijarlo en capture y playback.
# - RNNoise solo trabaja a 48 kHz.
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Noise Canceling source"
            media.name       = "Noise Canceling source"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = rnnoise
                        plugin = librnnoise_ladspa
                        label  = noise_suppressor_mono
                        control = {
                            # % de certeza de voz para dejar pasar audio; más alto = más agresivo.
                            "VAD Threshold (%)"          = 90.0
                            "VAD Grace Period (ms)"      = 200
                            "Retroactive VAD Grace (ms)" = 0
                        }
                    }
                ]
            }
            capture.props = {
                node.name      = "capture.rnnoise_source"
                node.passive   = true
                audio.rate     = 48000
                audio.channels = 1
                audio.position = [ MONO ]
            }
            playback.props = {
                node.name      = "rnnoise_source"
                media.class    = Audio/Source
                audio.rate     = 48000
                audio.channels = 1
                audio.position = [ MONO ]
            }
        }
    }
]
