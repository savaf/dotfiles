# Modesetting KMS: obligatorio para Wayland/Hyprland.
# fbdev=1: framebuffer de consola gestionado por el driver, necesario para que
#          los TTY y un kernel panic sean legibles con la 3080 en Wayland.
options nvidia_drm modeset=1 fbdev=1

# Preserva la VRAM al suspender/hibernar. En la rama 610 ya es el valor por
# defecto; se fija explicitamente para no depender de la version del driver.
#
# NO poner NVreg_EnableGpuFirmware=0: el modulo abierto (nvidia-open) exige el
# firmware GSP y lo ignora en silencio (estuvo puesto desde 2026-09 como
# "fix" del Xid 120 y nvidia-smi seguia reportando GSP activo). Ver
# docs/omarchy.md.
options nvidia NVreg_PreserveVideoMemoryAllocations=1
