# 244 = 4 (teclado) + 16 (sync) + 32 (remount ro) + 64 (señales) + 128 (reboot/poweroff): REISUB completo.
# Con el sistema vivo y la GPU colgada, Alt+Impr Pant + R E I S U B apaga limpio en vez de cortar la energía
# (un corte brusco truncó /etc/coolercontrol/.tokens y dejó los discos recuperando journal).
# El valor por defecto de la distro es 16 (solo sync); 90- gana a /usr/lib/sysctl.d/50-default.conf.
kernel.sysrq = 244
