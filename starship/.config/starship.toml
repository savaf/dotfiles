"$schema" = 'https://starship.rs/config-schema.json'

# Prompt unificado entre zsh y bash (ver docs/shell-and-dotfiles.md). Punto de
# partida basado en los segmentos de p10k/.p10k.zsh (backup, sin borrar); se
# afina editando este archivo, sin tocar ningún shell.
#
# Colores como índices ANSI 0-15 a propósito (igual que p10k/.p10k.zsh): así
# el prompt hereda la paleta que defina la terminal y sigue el tema activo en
# vez de fijar colores hex/256.

format = """
$os$directory$git_branch$git_status$docker_context$nodejs$php$python$rust$golang$cmd_duration
$character"""

right_format = """$status$jobs$time"""

add_newline = true

[os]
disabled = false
style = "bold fg:6"

[os.symbols]
Macos = "󰀵"
Ubuntu = ""
Fedora = ""
Arch = ""

[directory]
style = "bold fg:4"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "fg:6"
format = "[on](fg:7) [$symbol$branch]($style) "

[git_status]
style = "fg:3"
format = "([$all_status$ahead_behind]($style)) "
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[docker_context]
symbol = " "
style = "fg:4"
format = "[$symbol$context]($style) "
only_with_files = true

[nodejs]
symbol = " "
style = "fg:2"
format = "[$symbol($version )]($style)"

[php]
symbol = " "
style = "fg:5"
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style = "fg:3"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "fg:1"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "fg:6"
format = "[$symbol($version )]($style)"

[cmd_duration]
min_time = 2000
format = " took [$duration](fg:3)"

[character]
success_symbol = "[❯](bold fg:2)"
error_symbol = "[❯](bold fg:9)"
vimcmd_symbol = "[❮](bold fg:2)"

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "✘ "
style = "fg:9"

[jobs]
symbol = "✦"
style = "fg:6"
format = "[$symbol$number]($style) "

[time]
disabled = false
format = "[$time](fg:6)"
time_format = "%H:%M"
